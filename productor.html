Tu trabajo alimenta el futuro. Agrotec te ayuda a mostrar tus productos y encontrar nuevos compradores.
</p>

<div class="formulario-productor">

<h2>Registra tu producto</h2>

<label>Nombre del producto</label>

<input type="text" placeholder="Ej. Mango Kent">


<label>Cantidad disponible</label>

<input type="text" placeholder="Ej. 500 kg">


<label>Precio referencial</label>

<input type="number" placeholder="Ej. 3.50">


<label>Fecha de cosecha</label>

<input type="date">


<label>Distrito</label>

<select>

<option>Selecciona tu distrito</option>
<option>Monsefú</option>
<option>Chiclayo</option>
<option>Ferreñafe</option>
<option>Mórrope</option>
<option>Lambayeque</option>

</select>


<label>Descripción</label>

<textarea placeholder="Describe tu producto"></textarea>


<button class="verde">
Publicar producto
</button>

</div>
